# ---------------------------------------------------------------------------
# Gestion de Almacen: entorno de DESARROLLO
# ---------------------------------------------------------------------------
#
# Uso:
#   docker compose -f deploy/docker-compose.dev.yml --env-file .env up -d
#
# QUE HACE DIFERENTE A DESARROLLO
# -------------------------------
#  - Publica los puertos de la API (8000), de la web (3000) y de Authentik
#    (9000) para poder entrar por el navegador sin pasar por Caddy.
#  - No usa HTTPS: en desarrollo el certificado no aporta nada y obliga a
#    hacer una excepcion en el navegador.
#  - Monta el codigo fuente como volumen: se edita en el host y se ve al
#    instante. En produccion el codigo va DENTRO de la imagen.
#
# LO QUE NUNCA DEBE COPIARSE A PRODUCCION
# ----------------------------------------
#  - Los puertos publicados. En produccion solo Caddy esta expuesto.
#  - Los volumenes de codigo. En produccion el codigo va en la imagen.
#  - El servicio `cola`: en desarrollo corre el planificador dentro del mismo
#    contenedor que la API. En produccion es un contenedor aparte, para que
#    un trabajo lento no retrase las peticiones.
#
# ---------------------------------------------------------------------------

name: almacen-dev

services:

  # -------------------------------------------------------------------------
  # PostgreSQL.
  #
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
  # se usa para crear la base y para las tareas administrativas. La
  # aplicacion NUNCA conecta con el.
  #
  # El rol de la aplicacion (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
  # para que las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
  # superusuarios "always bypass the row security system", y que
  # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
  # superusuario. Con un solo rol las politicas no se aplicarian y el
  # aislamiento entre empresas seria decorativo. Ver docs/03.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-almacen}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-almacen_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-almacen_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-almacen_app} -d ${DB_DATABASE:-almacen}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Redis: cache y colas.
  #
  # Las colas no son un adorno aca: es lo que libera las reservas vencidas.
  # Sin Redis el almacen sigue respondiendo, pero un pedido olvidado mantiene
  # la mercaderia reservada para siempre. Ver docs/07.
  # -------------------------------------------------------------------------
  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

  # -------------------------------------------------------------------------
  # API (Laravel).
  # -------------------------------------------------------------------------
  api:
    image: almacen-api-dev
    build:
      context: ../api
      dockerfile: ../deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_NAME: "Almacén Hefesto"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?falta APP_KEY en el .env}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:3000}
      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-almacen}
      DB_USERNAME: ${DB_USERNAME:-almacen_app}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"

      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:?falta AUTHENTIK_ISSUER en el .env}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?falta AUTHENTIK_CLIENT_ID en el .env}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:?falta AUTHENTIK_CLIENT_SECRET en el .env}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:?falta AUTHENTIK_REDIRECT_URI en el .env}
      AUTHENTIK_SCOPES: ${AUTHENTIK_SCOPES:-openid profile email}
      AUTHENTIK_ALGORITMO: ${AUTHENTIK_ALGORITMO:-RS256}

      ALMACEN_HORAS_VALIDEZ_RESERVA: ${ALMACEN_HORAS_VALIDEZ_RESERVA:-72}
      ALMACEN_DIAS_ENTRE_CONTEO: ${ALMACEN_DIAS_ENTRE_CONTEO:-30}

      ALMACEN_CORRER_MIGRACIONES: "true"
    volumes:
      # En desarrollo el codigo viene del host. En produccion NO.
      - ../api:/var/www/html
    ports:
      - "8000:8080"

  # -------------------------------------------------------------------------
  # Planificador y trabajador de colas: misma imagen, otro comando.
  #
  # En desarrollo corre en un contenedor aparte igual que en produccion, para
  # que el comportamiento del planificador sea el mismo que se desplegara. Lo
  # que cambia es que aqui el proceso no tiene limite de tiempo.
  # -------------------------------------------------------------------------
  cola:
    image: almacen-api-dev
    build:
      context: ../api
      dockerfile: ../deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
    # `schedule:work` corre el planificador (liberar reservas vencidas,
    # conciliar saldos) y el trabajador en el mismo proceso.
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-almacen}
      DB_USERNAME: ${DB_USERNAME:-almacen_app}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      LOG_CHANNEL: stack
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
    volumes:
      - ../api:/var/www/html

  # -------------------------------------------------------------------------
  # Interfaz (Nuxt).
  # -------------------------------------------------------------------------
  web:
    build:
      context: ../web
      dockerfile: ../deploy/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:8080
      NUXT_PUBLIC_BASE: ${APP_WEB_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

  # -------------------------------------------------------------------------
  # Authentik (proveedor de identidad).
  #
  # Desde la version 2025.10 Authentik NO usa Redis y son tres servicios:
  # `postgresql`, `server` y `worker`. `server` y `worker` usan LA MISMA
  # imagen con distinto `command`. No existe una imagen `worker` aparte.
  #
  # OJO: la etiqueta de la imagen de Authentik se heredo del Portal de
  # Autoservicio y NO se verifico contra el registro en esta sesion. Antes de
  # produccion hay que comprobarla. Ver docs/10.
  # -------------------------------------------------------------------------
  authentik-postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:?falta AUTHENTIK_POSTGRESQL__PASSWORD en el .env}
    volumes:
      - authentik-postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_POSTGRESQL__USER:-authentik}"]
      interval: 10s
      timeout: 5s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: server
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?falta AUTHENTIK_SECRET_KEY en el .env}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_BOOTSTRAP__EMAIL: ${AUTHENTIK_BOOTSTRAP__EMAIL:-akadmin@hefestostudio.cl}
      AUTHENTIK_BOOTSTRAP__PASSWORD: ${AUTHENTIK_BOOTSTRAP__PASSWORD:?falta AUTHENTIK_BOOTSTRAP__PASSWORD en el .env}
      AUTHENTIK_BOOTSTRAP__TOKEN: ${AUTHENTIK_BOOTSTRAP__TOKEN:?falta AUTHENTIK_BOOTSTRAP__TOKEN en el .env}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik-media:/media
    ports:
      # Solo en la interfaz local del host: en produccion esto NO se publica.
      - "9000:9000"

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_BOOTSTRAP__EMAIL: ${AUTHENTIK_BOOTSTRAP__EMAIL}
      AUTHENTIK_BOOTSTRAP__PASSWORD: ${AUTHENTIK_BOOTSTRAP__PASSWORD}
      AUTHENTIK_BOOTSTRAP__TOKEN: ${AUTHENTIK_BOOTSTRAP__TOKEN}
    volumes:
      - authentik-media:/media

volumes:
  postgres-datos:
  authentik-postgres-datos:
  authentik-media: