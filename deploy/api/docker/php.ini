; Configuracion de PHP para el almacen.
; Valores pensados para un almacen de PyME: carga baja y errores visibles.

[PHP]
; El limite de memoria holga para el calculo de rutas y la conciliacion de
; saldos, que son las operaciones mas pesadas del sistema.
memory_limit = 256M

; Errores a pantalla solo en desarrollo: en produccion un error con detalle
; puede mostrar rutas internas o consultas SQL a un visitante.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Fecha y hora: el almacen opera en horario de Chile.
date.timezone = America/Santiago

; Sesion y cookies
session.cookie_httponly = 1
; `use_strict_mode` obliga al navegador a mandar el id de sesion que le dio el
; servidor: sin esto, un id inventado por alguien mas seria aceptado.
session.use_strict_mode = 1
session.use_only_cookies = 1

; No exponer la version de PHP en las cabeceras.
expose_php = Off

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0